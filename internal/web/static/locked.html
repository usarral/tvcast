<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{index .S "page.title"}}</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:18px/1.5 system-ui, sans-serif; background:#14171c; color:#f2f2f2; padding:24px; box-sizing:border-box; }
  main { max-width:420px; width:100%; text-align:center; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#a0a6b0; margin:0 0 20px; }
  input { width:100%; box-sizing:border-box; font-size:32px; letter-spacing:8px; text-align:center;
          padding:14px; border-radius:12px; border:2px solid #3a404a; background:#1f242c; color:#f2f2f2; }
  button { width:100%; margin-top:12px; padding:16px; border:0; border-radius:12px; font-size:18px; font-weight:600;
           background:#ffb347; color:#1b1b1b; }
  #err { color:#ff6b6b; min-height:1.5em; margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>{{index .S "locked.heading"}}</h1>
  <p>{{index .S "locked.help"}}</p>
  <form id="f">
    <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="······" required autofocus>
    <button type="submit">{{index .S "locked.enter"}}</button>
  </form>
  <div id="err"></div>
</main>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', body: new URLSearchParams({ pin: document.getElementById('pin').value }) })
    .catch(() => null);
  if (r && r.ok) { location.replace('/'); return; }
  err.textContent = r ? (await r.text()).trim() : {{index .S "locked.no_tv"}};
};
</script>
</body>
</html>
