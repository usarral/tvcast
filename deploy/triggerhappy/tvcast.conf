# Atajos de teclado de la caja para tvcast (teclado USB o receptor 2,4 GHz).
# Instalar:  sudo cp tvcast.conf /etc/triggerhappy/triggers.d/
#            sudo systemctl restart triggerhappy
# Probar sin teclado:  curl -X POST 'http://127.0.0.1/api/tv/qr?v=1'
#
# Ctrl+Alt+Q: QR fijo en la tele, aunque haya fotos o lleguen nuevas.
KEY_Q+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/qr?v=1
# Ctrl+Alt+S: volver al pase de fotos.
KEY_S+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/qr?v=0
# Ctrl+Alt+C: parar tvcast y ver el login local (en tty2, ver deploy/splash).
KEY_C+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/local/sbin/tvcast-consola
# Ctrl+Alt+T: arrancar o reiniciar tvcast.
KEY_T+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/systemctl restart tvcast
