# Keyboard shortcuts on the box for tvcast (USB keyboard or 2.4 GHz dongle).
# Install:  sudo cp tvcast.conf /etc/triggerhappy/triggers.d/
#           sudo systemctl restart triggerhappy
# Test without a keyboard:  curl -X POST 'http://127.0.0.1/api/tv/qr?v=1'
#
# Ctrl+Alt+Q: pin the QR on the TV, even if there are photos or new ones arrive.
KEY_Q+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/qr?v=1
# Ctrl+Alt+S: back to the slideshow.
KEY_S+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/qr?v=0
# Ctrl+Alt+C: stop tvcast and show the local login (on tty2, see deploy/splash).
KEY_C+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/local/sbin/tvcast-consola
# Ctrl+Alt+T: start or restart tvcast.
KEY_T+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/systemctl restart tvcast
