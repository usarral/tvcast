# Keyboard on the box for tvcast (USB keyboard or 2.4 GHz dongle).
# Install:  sudo cp tvcast.conf /etc/triggerhappy/triggers.d/
#           sudo systemctl restart triggerhappy
#
# Every key goes to tvcast's /api/tv/key, like the remote's: with the admin
# panel closed the arrows change photo, Enter pauses, Esc returns to the
# slideshow; with it open they drive the menu.
#
# Ctrl+Alt+A: open the admin panel (everything else lives there).
KEY_A+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=admin
KEY_UP     1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=up
KEY_DOWN   1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=down
KEY_LEFT   1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=left
KEY_RIGHT  1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=right
KEY_ENTER  1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=enter
KEY_ESC    1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/key?k=esc
#
# Old shortcuts, kept working but no longer documented (they are in the panel):
KEY_Q+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/qr?v=1
KEY_S+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/curl -s -m 3 -X POST http://127.0.0.1/api/tv/qr?v=0
KEY_C+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/local/sbin/tvcast-consola
KEY_T+KEY_LEFTCTRL+KEY_LEFTALT 1 /usr/bin/systemctl restart tvcast
