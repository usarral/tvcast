# Hardware watchdog: if the kernel freezes (no panic, so kernel.panic=10
# never fires), the SoC resets itself. Without this a hang means someone
# has to unplug the box.
# Install:  sudo mkdir -p /etc/systemd/system.conf.d
#           sudo cp watchdog.conf /etc/systemd/system.conf.d/tvcast-watchdog.conf
#           sudo reboot      (systemctl daemon-reexec also works)
# Check:    systemctl show -p RuntimeWatchdogUSec   (should not be 0)
#           ls /dev/watchdog*                       (the device must exist)
# Undo:     delete the file and reboot.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=2min
